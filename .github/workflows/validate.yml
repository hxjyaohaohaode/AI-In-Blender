name: Validate add-on
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff
      - run: ruff check ai_modeling_assistant tests tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: addon-installers
          path: dist/
  blender:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['3.6.23', '4.2.0', '4.5.3', '5.1.1']
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6 libasound2t64
      - name: Download portable Blender and verify checksum
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          series="${BLENDER_VERSION%.*}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender${series}"
          curl --fail --retry 3 -LO "${base}/${archive}"
          curl --fail --retry 3 -Lo checksums.txt "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${archive}$" checksums.txt | sha256sum -c -
          mkdir blender-test
          tar -xf "${archive}" -C blender-test --strip-components=1
      - run: ./blender-test/blender --background --factory-startup --python-exit-code 1 --python tests/blender_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-${{ matrix.version }}-validation
          path: artifacts/validation/
