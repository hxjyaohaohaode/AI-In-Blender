name: Validate add-on
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ruff==0.16.7
      - run: ruff check ai_modeling_assistant tests tools
      - run: python -m unittest discover -s tests -v
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: addon-installers-${{ matrix.os }}-${{ matrix.python }}
          path: dist/
  blender:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        version: ['3.6.23', '4.2.23', '4.5.14', '5.1.2', '5.2.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6 libasound2t64
      - name: Download portable Blender and verify checksum
        shell: bash
        env:
          BLENDER_VERSION: ${{ matrix.version }}
        run: |
          series="${BLENDER_VERSION%.*}"
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender${series}"
          curl --fail --retry 3 -LO "${base}/${archive}"
          curl --fail --retry 3 -Lo checksums.txt "${base}/blender-${BLENDER_VERSION}.sha256"
          grep "${archive}$" checksums.txt | sha256sum -c -
          mkdir blender-test
          tar -xf "${archive}" -C blender-test --strip-components=1
      - name: Validate source and installed packages
        run: python tools/validate_blender.py --blender ./blender-test/blender
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-${{ matrix.version }}-validation
          path: artifacts/validation/
  blender-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download verified Blender 5.2.2 for Apple silicon
        shell: bash
        run: |
          archive="blender-5.2.2-macos-arm64.dmg"
          base="https://download.blender.org/release/Blender5.2"
          curl --fail --retry 3 -LO "${base}/${archive}"
          curl --fail --retry 3 -Lo checksums.txt "${base}/blender-5.2.2.sha256"
          grep "${archive}$" checksums.txt | shasum -a 256 -c -
          mkdir -p blender-test
          hdiutil attach "${archive}" -nobrowse -mountpoint "${RUNNER_TEMP}/blender-mount"
          trap 'hdiutil detach "${RUNNER_TEMP}/blender-mount"' EXIT
          ditto "${RUNNER_TEMP}/blender-mount/Blender.app" blender-test/Blender.app
      - name: Validate source and installed packages on macOS
        run: python tools/validate_blender.py --blender ./blender-test/Blender.app/Contents/MacOS/Blender
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-5.2.2-macos-validation
          path: artifacts/validation/
